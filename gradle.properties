# Build-server tuning for this sandbox:
# - The Gradle daemon cannot run here (it needs loopback TCP, which the
#   sandbox denies to the JVM), so builds must use --no-daemon.
# - The Kotlin compile daemon has the same problem, so the compiler runs
#   in-process via kotlin.compiler.execution.strategy=in-process.
# - Small heaps: this VM has limited free RAM.
org.gradle.daemon=false
org.gradle.caching=true
# NOTE: do NOT set org.gradle.jvmargs here -- it makes Gradle fork a
# single-use daemon (loopback TCP, blocked in this sandbox) even with
# --no-daemon. Heap is controlled via GRADLE_OPTS in android-env.sh.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
